# CI (issue #70). All tools come from devbox.json (pinned in devbox.lock); jobs run the same
# `devbox run` scripts as local development.
#   catala : type-check + run Catala tests, summarize the three-way difftest.
#   lean   : lake build, lake check, lake comparator (Lean kernel replay and Comparator,
#            sandboxed by bubblewrap), then scripts/audit.sh.
# See docs/audit.md and docs/comparator.md. This file cannot be run locally;
# it was validated with actionlint (see docs/audit.md, "CI").
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catala:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Installs devbox and the packages of devbox.json/devbox.lock; the nix store is cached.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.18.0

      # Catala 1.3.0 is built into the project-local opam root .opam (nixpkgs has no Catala).
      # Cached on the pinned versions, so only the first run compiles OCaml.
      - name: Cache opam root (OCaml + Catala)
        uses: actions/cache@v4
        with:
          path: .opam
          key: opam-${{ runner.os }}-${{ hashFiles('devbox.lock', 'devbox.json', 'scripts/catala-setup.sh') }}

      - name: Install Catala 1.3.0 (devbox run catala-setup)
        run: devbox run catala-setup

      - name: devbox run check (type-check, run #[test] scopes)
        run: devbox run check

      # Report, do not gate: the difftest lists known Direct File differences
      # (see docs/direct-file-bugs.md). The summary goes to the job page.
      - name: make difftest SCOPE=all (summary)
        run: |
          set -o pipefail
          devbox run -- make difftest SCOPE=all 2>&1 | tee difftest.log || true
          {
            echo '### make difftest SCOPE=all'
            echo '```'
            tail -40 difftest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Outside /home and /root: the bwrap sandbox of `lake check` and
      # `lake comparator` covers both with a tmpfs (docs/comparator.md).
      ELAN_HOME: /opt/elan
      LEAN_WORK: /opt/ustax-lean
    steps:
      - uses: actions/checkout@v4

      # bwrap itself comes from devbox.json (Linux only). The sandbox mounts tmpfs on
      # /run/user, /home, /root and /tmp after binding / read-only, so they must exist.
      - name: Prepare directories
        run: |
          sudo mkdir -p /run/user /home /root /tmp
          sudo mkdir -p "$ELAN_HOME" "$LEAN_WORK"
          sudo chown -R "$USER" "$ELAN_HOME" "$LEAN_WORK"

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.18.0

      # ubuntu-24.04 sets kernel.apparmor_restrict_unprivileged_userns=1, which
      # makes bwrap fail with "setting up uid map: Permission denied". Probe
      # first (with the devbox bwrap); relax the sysctl only if the probe fails.
      - name: Allow unprivileged user namespaces for bwrap
        run: |
          probe() { devbox run -- bwrap --ro-bind / / --tmpfs /tmp --dev /dev --proc /proc \
                      --unshare-all --die-with-parent --new-session -- true; }
          if probe; then
            echo "bwrap works as is"
          else
            echo "bwrap probe failed; relaxing apparmor_restrict_unprivileged_userns"
            sysctl kernel.apparmor_restrict_unprivileged_userns || true
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            probe
          fi

      # elan (nix package) installs the toolchain pinned by lean/lean-toolchain into ELAN_HOME.
      - name: Cache elan and the Lean toolchain
        uses: actions/cache@v4
        with:
          path: /opt/elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}

      - name: Install the pinned Lean toolchain
        run: devbox run -- elan toolchain install "$(cat lean/lean-toolchain)"

      # Build in a copy outside /home (as the container setup does with /work);
      # .lake (dependency clones and build output) is cached.
      - name: Cache lake build output
        uses: actions/cache@v4
        with:
          path: /opt/ustax-lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-

      - name: Sync lean/ to /opt/ustax-lean
        run: |
          find "$LEAN_WORK" -mindepth 1 -maxdepth 1 ! -name .lake -exec rm -rf {} +
          tar -C lean --exclude=./.lake -cf - . | tar -C "$LEAN_WORK" -xf -

      - name: lake build
        run: devbox run -- make lean-build LEAN_DIR="$LEAN_WORK"

      - name: lake check (kernel replay, axiom allow-list)
        run: devbox run -- make lean-check LEAN_DIR="$LEAN_WORK"

      - name: lake comparator (challenge vs solution)
        run: devbox run -- make lean-comparator LEAN_DIR="$LEAN_WORK"

      - name: make audit (source scan, #audit_all, forensics)
        run: LEAN_DIR="$LEAN_WORK" devbox run audit
